name: Solar Daily Report

on:
  workflow_dispatch:
  schedule:
    # 13:30 UTC = 20:30 Asia/Bangkok — end of the solar generation day
    - cron: "30 13 * * *"

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: solar-monitor
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm init -y > /dev/null
          npm install playwright@1.49
          npx playwright install --with-deps chromium

      - name: Fetch FusionSolar daily report
        env:
          FUSIONSOLAR_USERNAME: ${{ secrets.FUSIONSOLAR_USERNAME }}
          FUSIONSOLAR_PASSWORD: ${{ secrets.FUSIONSOLAR_PASSWORD }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          REPORT_TO: ${{ vars.SOLAR_REPORT_TO }}
        run: node fetch-report.js

      - name: Upload report + screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: solar-report-${{ github.run_number }}
          path: solar-monitor/out/
          retention-days: 30
